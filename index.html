<style>

             border: 3px solid #ffffff66; background: #ff5d73d8; touch-action: none; padding: 0; display: grid; place-items: center; box-shadow: 0 6px 18px #0008; }

<body>
<canvas id="game"></canvas>
<div id="safe" style="position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);pointer-events:none"></div>

</div></div>
<script>
/* ═══ BOMB ARENA · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Drop bombs, break crates, be the last one standing. Versus, 2–8 players; bots fill the
 * arena up to four. First to 3 round wins takes the match.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ arena size, fuse, blast, speeds, power-ups, rounds, sudden death, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ARENA ......... the tile grid: pillars, crates, hidden power-ups, spawns, the sudden-death spiral
 *   BOMBS ......... where a bomb is (kicked bombs slide), how far a blast reaches, chain reactions
 *   WALKING ....... tile-to-tile movement for players and bots; smoothing other people's moves
 *   ROUNDS (HOST) . countdown, play, who got caught, round wins, the match. Only the host writes these.
 *   WORLD (HOST) .. bombs going off, crates breaking, power-ups, kicks, walls closing in
 *   BOTS (HOST) ... danger map, running from blasts, bombing crates and rivals, grabbing power-ups, kicking bombs
 *   ME ............ my walker, dropping bombs, kicking, picking up. Each player writes only its own.
 *   EFFECTS ....... particles, shake, sounds, and spotting what changed in state
 *   DRAW .......... floor, blocks, crates, power-ups, bombs, flames, players, top bar, banners
 *   HUD & RESULTS . #net, the hint, the results card, leaderboard
 *   INPUT ......... keyboard, D-pad and bomb button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` {r, x, y, f, k, w} (round id, position in tiles,
 *     facing, tiles stepped so far, the last three tiles stepped on) up to ~14 times a second
 *     while it moves, `hb` (heartbeat) once a second, `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `round` {id, v, ph, rn, seed, startAt, sdAt, endsAt, players, bots, spot, out, wins, win, champ, ready}:
 *               the round and the match. `v` goes up on every write. Someone who joins mid-round
 *               takes over a bot still in it (`spot` = the tile they start on).
 *       `grid`  {r, g}: the arena as ONE string ("#" wall, "." floor, "c" crate, B F S K power-ups)
 *       `boom`  {r, t, nb, b, f}: live bombs (each with its explode time) and blasts still burning
 *       `stats` {r, s}: each player's power-ups [bombs, blast, speed, kick]
 *       `bots`  {r, l}: where the bots are, ~10 times a second
 *   - Intents to the host: "bomb" {r, x, y}, "kick" {r, i, d}, "pick" {r, x, y}, "ready" {}.
 *     The host checks each against state and writes the result. Its own player calls the same
 *     functions directly (mp.send never comes back to the sender).
 *   - Every bomb carries its explode time `at`. At that moment every screen sets it off itself
 *     (same chain rules, same state), so the flames appear everywhere at once; the host's result
 *     (broken crates, who got caught) lands in state a moment later.
 *   - What a crate hides comes from the round's seed, so a new host knows too.
 *   - A new host adopts round, grid, bombs, stats and bots from state and carries on.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "round-wins": every round you win adds 1.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  cols: 15, rows: 13,       // arena size in tiles, both odd (a pillar stands on every even/even tile)
  seats: 4,                 // bots fill the arena up to this many players
  maxPlayers: 8,            // more people than this watch and play a later round
  winsToWin: 3,             // round wins that take the match
  crates: 0.7,              // share of open tiles that start with a crate
  dropChance: 0.4,          // chance a crate hides a power-up
  drops: { B: 0.34, F: 0.32, S: 0.2, K: 0.14 }, // which one: B = +1 bomb, F = +1 blast, S = speed, K = kick
  startBombs: 1,            // bombs you can have out at once at the start of a round…
  maxBombs: 8,              // …and at most
  startFire: 2,             // tiles a blast reaches each way at the start…
  maxFire: 8,               // …and at most
  maxSpeed: 4,              // Speed power-ups that count
  fuseMs: 2400,             // a bomb's fuse
  flameMs: 550,             // how long a blast keeps burning
  stepMs: 190,              // ms to walk one tile…
  speedStepMs: 22,          // …minus this per Speed power-up
  kickTileMs: 75,           // a kicked bomb slides one tile this fast
  roundMs: 50000,           // ms of play before sudden death
  sdStepMs: 160,            // sudden death: a wall block drops this often, spiralling inward
  hurryMs: 2500,            // when every person in the round is out, sudden death starts this soon
  countMs: 3000,            // countdown before a round
  endMs: 3000,              // the "wins the round" moment
  overMs: 12000,            // the match results card
  sendMs: 70,               // my position goes out at most this often (~14/s)
  worldMs: 90,              // the host writes bombs, grid and bots at most this often
  botThinkMs: [120, 320],   // a bot's pause before it picks its next move
  botReactMs: [220, 520],   // how long a bot takes to notice a blast aimed at it
  botBombGapMs: [600, 1600], // a bot waits this long between its bombs
  botAggro: 0.4,            // chance per thought that a bot bombs a rival in its blast line…
  botAggroLate: 0.85,       // …and once the walls start dropping
  botHunt: 0.4,             // chance a bot goes after a rival while there are still crates to break
  botMistake: 0.18,         // chance a bot misjudges how far other bombs reach when it runs
  botKick: 0.75,            // chance a bot with Kick boots a bomb beside it down the lane at a rival…
  botKickGapMs: [500, 1200], // …and how long until it looks for another one to kick
  botSafetyMs: 200,         // bots keep this much time between themselves and a blast
  wallAheadMs: 2500,        // bots leave tiles that sudden-death walls fill within this long
  board: "round-wins",      // leaderboard name
};
const BOT_NAMES = ["Boomer", "Sparky", "Fuse", "Kaboom", "Dynamo", "Wick", "Blasty", "Pop"];
const COLORS = ["#ff5d73", "#4cc9f0", "#ffd23f", "#7ae582", "#c77dff", "#ff9f43", "#f472b6", "#2ee6c9"];
const ITEMS = { B: "Bomb", F: "Fire", S: "Speed", K: "Kick" };            // power-ups, as letters in the grid
const ITEM_TEXT = { B: "+1 bomb", F: "+1 blast", S: "Faster!", K: "Kick bombs!" };
const ITEM_COLOR = { B: "#4c7dff", F: "#ff5a3c", S: "#22b866", K: "#a259ff" };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'bomb-arena',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field (shared or a player's), parsed once per change, then `map`ped. Read-only: never mutate it. */
function cached(key, raw, fb, map) { const m = memo.get(key); if (m && m.raw === raw) return m.v; let v = parse(raw, fb); if (map && v) v = map(v); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} }, amHost = false, joinedAt = 0;
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── ARENA ───────────────────────────────────────────────────────────────────────────
// Tiles in the grid string: "#" wall or pillar · "." floor · "c" crate · B F S K a power-up lying on the floor.
const C = CONFIG.cols, R = CONFIG.rows, N = C * R;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // directions: 0 up, 1 right, 2 down, 3 left
const tileOf = (x, y) => y * C + x;
const inArena = (x, y) => x >= 0 && y >= 0 && x < C && y < R;
const isPillar = (x, y) => x === 0 || y === 0 || x === C - 1 || y === R - 1 || (x % 2 === 0 && y % 2 === 0);
const rand = (a, b) => a + Math.random() * (b - a);
const MIDX = Math.floor(C / 2), MIDY = Math.floor(R / 2);
/** Start tiles in seat order: the four corners, then the middle of each side. */
const SPAWNS = [[1, 1], [C - 2, R - 2], [C - 2, 1], [1, R - 2], [MIDX, 1], [MIDX, R - 2], [1, MIDY], [C - 2, MIDY]];
/** Sudden death fills the open tiles in this order: round the outside, then inward. */
const SPIRAL = (() => {
  const out = []; let x0 = 1, y0 = 1, x1 = C - 2, y1 = R - 2;
  while (x0 <= x1 && y0 <= y1) {
    for (let x = x0; x <= x1; x++) out.push(tileOf(x, y0));
    for (let y = y0 + 1; y <= y1; y++) out.push(tileOf(x1, y));
    if (y1 > y0) for (let x = x1 - 1; x >= x0; x--) out.push(tileOf(x, y1));
    if (x1 > x0) for (let y = y1 - 1; y > y0; y--) out.push(tileOf(x0, y));
    x0++; y0++; x1--; y1--;
  }
  return out.filter((t) => !isPillar(t % C, Math.floor(t / C)));
})();
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/** A fresh arena from a seed: pillars, then crates everywhere except around the start tiles. */
function makeGrid(seed) {
  const rnd = mulberry32(seed), g = [];
  for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
    const nearStart = SPAWNS.some(([sx, sy]) => Math.abs(sx - x) <= 1 && Math.abs(sy - y) <= 1);
    g.push(isPillar(x, y) ? "#" : !nearStart && rnd() < CONFIG.crates ? "c" : ".");
  }
  return g;
}
const EMPTY_GRID = (() => { const s = CONFIG.crates; CONFIG.crates = 0; const g = makeGrid(1).join(""); CONFIG.crates = s; return g; })();
/** What crate tile t hides this round ("." = nothing). The same on every screen: it comes from the seed. */
function hiddenItem(seed, t) {
  const rnd = mulberry32((seed ^ Math.imul(t + 1, 2654435761)) >>> 0);
  if (rnd() >= CONFIG.dropChance) return ".";
  let k = rnd();
  for (const [item, p] of Object.entries(CONFIG.drops)) if ((k -= p) < 0) return item;
  return "B";
}

// ── BOMBS ───────────────────────────────────────────────────────────────────────────
// A bomb: { i: id, x, y, at: explode time (Date.now() ms), p: blast length, o: owner's seat, k: kick or null }.
// A kicked bomb slides from (k.x0, k.y0) to (x, y) between k.t0 and k.t1.
function bombPos(b, now) {
  if (!b.k || now >= b.k.t1) return { x: b.x, y: b.y };
  const u = Math.max(0, (now - b.k.t0) / Math.max(1, b.k.t1 - b.k.t0));
  return { x: b.k.x0 + (b.x - b.k.x0) * u, y: b.k.y0 + (b.y - b.k.y0) * u };
}
const bombTile = (b, now) => { const p = bombPos(b, now); return [Math.round(p.x), Math.round(p.y)]; };
const bombTileSet = (bombs, now) => new Set(bombs.map((b) => { const [x, y] = bombTile(b, now); return tileOf(x, y); }));
/** How far a blast at (x, y) reaches each way [up, right, down, left]. It stops before a wall, and ON the
 *  first crate (it breaks), power-up (it burns) or bomb (it goes off too). */
function blastArms(x, y, power, grid, hasBomb) {
  const arms = [0, 0, 0, 0];
  for (let d = 0; d < 4; d++) for (let s = 1; s <= power; s++) {
    const tx = x + DX[d] * s, ty = y + DY[d] * s, c = inArena(tx, ty) ? grid[tileOf(tx, ty)] : "#";
    if (c === "#" || c === undefined) break;
    arms[d] = s;
    if (c !== "." || hasBomb(tx, ty)) break;
  }
  return arms;
}
/** A blast: { i: the bomb's id, at, o: owner's seat, x, y, a: arms }. */
function blastTiles(f) { const out = [tileOf(f.x, f.y)]; for (let d = 0; d < 4; d++) for (let s = 1; s <= f.a[d]; s++) out.push(tileOf(f.x + DX[d] * s, f.y + DY[d] * s)); return out; }
function inBlast(f, x, y) {
  if (x === f.x && y === f.y) return true;
  if (x === f.x) return y < f.y ? f.y - y <= f.a[0] : y - f.y <= f.a[2];
  if (y === f.y) return x > f.x ? x - f.x <= f.a[1] : f.x - x <= f.a[3];
  return false;
}
const burning = (f, now) => now >= f.at && now < f.at + CONFIG.flameMs;
/** The bombs whose time has come, plus every bomb their blasts reach (a chain goes off in the same moment).
 *  Pure: the host applies the result, every other screen uses it to show the blast on time. */
function resolveBlasts(bombs, grid, now, skip) {
  const live = skip ? bombs.filter((b) => !skip(b)) : bombs, tiles = new Map(live.map((b) => [b, bombTile(b, now)]));
  const queue = live.filter((b) => b.at <= now), gone = new Set(queue.map((b) => b.i)), blasts = [];
  const ats = new Map(queue.map((b) => [b.i, now - b.at < 250 ? b.at : now])); // long overdue (a new host): now
  while (queue.length) {
    const b = queue.shift(), [x, y] = tiles.get(b), at = ats.get(b.i);
    const a = blastArms(x, y, b.p, grid, (tx, ty) => live.some((o) => o !== b && tiles.get(o)[0] === tx && tiles.get(o)[1] === ty));
    const f = { i: b.i, at, o: b.o, x, y, a };
    blasts.push(f);
    for (const o of live) if (!gone.has(o.i) && inBlast(f, ...tiles.get(o))) { gone.add(o.i); ats.set(o.i, at); queue.push(o); }
  }
  return { blasts, gone };
}

// ── WALKING ─────────────────────────────────────────────────────────────────────────
/** A walker stands on tile (cx, cy), or is t (0..1) of the way from it to (tx, ty). k counts the tiles it
 *  has reached; trail holds the last three, so other screens can replay its path exactly. */
function newWalker(x, y) { return { cx: x, cy: y, tx: x, ty: y, t: 0, f: 2, k: 0, trail: [[x, y]] }; }
const walkerPos = (w) => ({ x: w.cx + (w.tx - w.cx) * w.t, y: w.cy + (w.ty - w.cy) * w.t });
const walkerTile = (w) => (w.t < 0.5 ? [w.cx, w.cy] : [w.tx, w.ty]);
/** Move a walker dt seconds. wants(w, onTile) lists the directions it would like, best first;
 *  blocked(x, y, d) says a tile can't be entered. Turning back halfway is allowed. */
function walk(w, dt, stepMs, wants, blocked) {
  let left = (dt * 1000) / stepMs;
  for (let guard = 0; guard < 4 && left > 1e-6; guard++) {
    if (w.t === 0) {
      const dirs = wants(w, true) || [];
      const d = dirs.find((dir) => !blocked(w.cx + DX[dir], w.cy + DY[dir], dir));
      if (dirs.length) w.f = d ?? dirs[0];
      if (d === undefined) return;
      w.tx = w.cx + DX[d]; w.ty = w.cy + DY[d];
    } else {
      const back = (wants(w, false) || [])[0];
      if (back !== undefined && w.cx - w.tx === DX[back] && w.cy - w.ty === DY[back] && !blocked(w.cx, w.cy, back)) {
        [w.cx, w.tx, w.cy, w.ty] = [w.tx, w.cx, w.ty, w.cy]; w.t = 1 - w.t; w.f = back;
      }
    }
    const step = Math.min(left, 1 - w.t);
    w.t += step; left -= step;
    if (w.t >= 1 - 1e-6) { w.cx = w.tx; w.cy = w.ty; w.t = 0; w.k++; w.trail.push([w.cx, w.cy]); if (w.trail.length > 3) w.trail.shift(); }
  }
}
const statsOf = (stats, id) => (stats && stats[id]) || [CONFIG.startBombs, CONFIG.startFire, 0, 0];
const stepMsOf = (stats, id) => Math.max(80, CONFIG.stepMs - Math.min(CONFIG.maxSpeed, statsOf(stats, id)[2]) * CONFIG.speedStepMs);

    if (left > 0) { label = `Round ${r.rn} · ${clock(left)}`; if (left < 10000) color = Math.floor(t / 300) % 2 ? "#ffd23f" : "#ff8c42"; }
    else { label = "Sudden death: the walls close in"; color = "#ff5d73"; }
  } else if (r.ph === "end") label = `Round ${r.rn} over`;
  else if (r.ph === "over") label = "Match over";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "800 15px system-ui, sans-serif"; ctx.fillStyle = color;
  ctx.fillText(label, W / 2, SAFE_TOP + 18);
  const perRow = Math.ceil(r.players.length / chipRows), cw = Math.min(124, (W - 16) / perRow) - 6;
  r.players.forEach((id, k) => {
    const row = Math.floor(k / perRow), inRow = Math.min(perRow, r.players.length - row * perRow), col = k - row * perRow;
    const x = W / 2 - (inRow * (cw + 6)) / 2 + col * (cw + 6), y = SAFE_TOP + 36 + row * 30, out = isOut(r, id) && r.ph === "play";
    ctx.globalAlpha = out ? 0.4 : 1;
    ctx.fillStyle = id === net.sessionId ? "#ffffff26" : "#ffffff12"; rr(x, y, cw, 24, 12); ctx.fill();
    ctx.fillStyle = colorOf(r, id); ctx.beginPath(); ctx.arc(x + 12, y + 12, 6, 0, 6.283); ctx.fill();
    const pips = CONFIG.winsToWin <= 5 ? CONFIG.winsToWin : 0, wins = r.wins[id] || 0, pw = pips ? pips * 9 + 4 : 22;
    ctx.font = "700 12px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillStyle = "#f3eefc";
    let name = id === net.sessionId ? "You" : nameOf(r, id);
    while (name.length > 1 && ctx.measureText(name).width > cw - 26 - pw) name = name.slice(0, -1);
    ctx.fillText(name, x + 22, y + 12.5);
    if (pips) for (let i = 0; i < pips; i++) { ctx.fillStyle = i < wins ? "#ffd23f" : "#ffffff30"; ctx.beginPath(); ctx.arc(x + cw - 10 - (pips - 1 - i) * 9, y + 12, 3.4, 0, 6.283); ctx.fill(); }
    else { ctx.textAlign = "right"; ctx.fillStyle = "#ffd23f"; ctx.fillText(String(wins), x + cw - 8, y + 12.5); }
    if (out) { ctx.strokeStyle = "#ff5d73"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 6, y + 12); ctx.lineTo(x + cw - 6, y + 12); ctx.stroke(); }
  });
  ctx.globalAlpha = 1;
}
/** My power-ups: beside the arena when there's room, else under it. */
function drawStats(r) {
  if (ATTRACT || !me.w || r.players.indexOf(net.sessionId) < 0) return;
  const s = statsOf(V.stats, net.sessionId), rows = [["B", s[0]], ["F", s[1]], ["S", s[2]], ["K", s[3] ? "on" : "–"]];
  const side = W - (OX + T * C) >= 96, size = 26;
  rows.forEach(([c, n], k) => {
    const x = side ? OX + T * C + 18 : W / 2 - 160 + k * 80 + 6, y = side ? OY + 8 + k * 36 : OY + T * R + 14;
    ctx.fillStyle = ITEM_COLOR[c]; rr(x, y, size, size, 8); ctx.fill();
    icon(c, x + size / 2, y + size / 2, size * 0.62);
    ctx.fillStyle = "#f3eefc"; ctx.font = "800 15px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(String(n), x + size + 8, y + size / 2 + 1);
  });
}
function drawFeed(now) {
  if (ATTRACT) return;
  fx.feed = fx.feed.filter((f) => now - f.born < 4000);
  ctx.font = "700 12px system-ui, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  fx.feed.forEach((f, k) => {
    const w = ctx.measureText(f.text).width + 16, x = OX + T * C - 8, y = OY + 10 + k * 24;
    ctx.globalAlpha = Math.min(1, (4000 - (now - f.born)) / 600);
    ctx.fillStyle = "#0e0c1fcc"; rr(x - w, y, w, 20, 10); ctx.fill();
    ctx.fillStyle = f.c; ctx.fillText(f.text, x - 8, y + 10.5);
  });
  ctx.globalAlpha = 1;
}
function bigText(text, color, y, size) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = Math.max(4, size / 9); ctx.strokeStyle = "#0e0c1f"; ctx.lineJoin = "round"; ctx.strokeText(text, OX + (T * C) / 2, y);
  ctx.fillStyle = color; ctx.fillText(text, OX + (T * C) / 2, y);
}
function drawBanners(r, t) {
  if (ATTRACT) return;
  const mid = OY + T * R * 0.42, big = Math.min(80, T * 2.4, W / 9), small = Math.max(14, Math.min(20, T * 0.6)), inRound = r.players.includes(net.sessionId);
  if (r.ph === "count") {
    const n = Math.ceil((r.startAt - t) / 1000);
    bigText(`Round ${r.rn}`, "#f3eefc", mid - big * 0.85, small * 1.4);
    bigText(n > 0 ? String(n) : "GO!", "#ffd23f", mid, big);
    if (!inRound) bigText("Watching: you're in the next round", "#a99fd6", mid + big * 0.8, small);
  } else if (r.ph === "play") {
    if (t - r.startAt < 700) bigText("GO!", "#7ae582", mid, big);
    else if (t >= r.sdAt && t - r.sdAt < 2200) bigText("SUDDEN DEATH!", "#ff5d73", mid, big * 0.62);
    if (!inRound) bigText("Watching: you're in the next round", "#a99fd6", OY + T * (R - 0.5), small);
    else if (isOut(r, net.sessionId)) bigText("Caught! Watch the rest of the round", "#ffb3bf", OY + T * (R - 0.5), small);
  } else if (r.ph === "end" || (r.ph === "over" && Date.now() - r.endsAt + CONFIG.overMs < 1600)) {
    const text = !r.win ? "Draw! Nobody survived" : r.win === net.sessionId ? "You win the round!" : `${nameOf(r, r.win)} wins the round!`;
    bigText(text, r.win ? colorOf(r, r.win) : "#f3eefc", mid, Math.min(big * 0.55, (T * C) / Math.max(10, text.length * 0.62)));
    if (r.ph === "end") bigText(`First to ${CONFIG.winsToWin} round wins takes the match`, "#a99fd6", mid + big * 0.6, small * 0.85);
  }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, dropped = false, hintRound = 0, placesHtml = ""; // dropped: the connection is down, the HUD keeps saying so
const lb = { sentFor: -1, sent: null, shownFor: -1 };
function hud(r) {
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${amHost ? " · you run the bombs and bots" : ""}`;
  if (!r) return;
  // how to play, for your first round: during the countdown and the first seconds
  if (!hintRound && r.players.includes(net.sessionId)) hintRound = r.id;
  const hint = $("hint"), showHint = !ATTRACT && r.id === hintRound && (r.ph === "count" || Date.now() - r.startAt < 4000);
  hint.textContent = (touchUI ? "D-pad moves · the red button drops a bomb" : "Arrows or WASD move · Space drops a bomb") + " · crates hide power-ups · last one standing wins the round";
  hint.style.top = Math.round(OY + T * R * 0.64) + "px"; hint.style.opacity = showHint ? 1 : 0;
  if (board && (r.ph === "end" || r.ph === "over") && r.win === net.sessionId && lb.sentFor !== r.id) { lb.sentFor = r.id; lb.sent = board.submit(1, "inc").catch(() => null); }
  $("over").hidden = ATTRACT || r.ph !== "over";
  if (r.ph !== "over") return;
  $("oTitle").textContent = r.champ === net.sessionId ? "You win the match!" : r.champ ? `${nameOf(r, r.champ)} wins the match!` : "Match over";
  $("oTitle").style.color = r.champ ? colorOf(r, r.champ) : "#f3eefc";
  const order = [...r.players].sort((a, b) => (r.wins[b] || 0) - (r.wins[a] || 0));
  const html = order.map((id) => { const w = r.wins[id] || 0; return `<li class="${id === net.sessionId ? "me" : ""}"><i style="background:${esc(colorOf(r, id))}"></i>${esc(id === net.sessionId ? "You" : nameOf(r, id))}<span>${w} win${w === 1 ? "" : "s"}</span></li>`; }).join("");
  if (html !== placesHtml) { placesHtml = html; $("places").innerHTML = html; }
  $("oNext").textContent = `Next match in ${Math.max(0, Math.ceil((r.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = me.ready === r.id ? "Waiting for the others…" : "Play again";
  if (lb.shownFor === r.id) return;
  lb.shownFor = r.id;
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class=\"note\">Loading…</li>";
  (lb.sentFor === r.id && lb.sent ? lb.sent : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li class=\"note\">No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
$("again").addEventListener("click", () => {
  const r = round();
  if (!r || r.ph !== "over") return;
  me.ready = r.id;
  if (isHost()) onReady(net.sessionId); else net.send("ready", {});
});

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches;
const held = [], KEYS = { ArrowUp: 0, w: 0, ArrowRight: 1, d: 1, ArrowDown: 2, s: 2, ArrowLeft: 3, a: 3 };
let padDir = -1;
/** Directions I'm holding, the newest first (if it's blocked, the walker tries the older ones). */
function heldDirs() { const out = padDir >= 0 ? [padDir] : []; for (let i = held.length - 1; i >= 0; i--) if (!out.includes(held[i])) out.push(held[i]); return out; }
addEventListener("keydown", (e) => {
  unlockAudio();
  const d = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (d !== undefined) { e.preventDefault(); if (!held.includes(d)) held.push(d); }
  else if ((e.key === " " || e.key === "Enter" || e.key.toLowerCase() === "x") && !e.repeat) { e.preventDefault(); me.wantBomb = true; }
});
addEventListener("keyup", (e) => { const d = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]; const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); });
addEventListener("blur", () => { held.length = 0; padDir = -1; });
const pad = $("pad"), bombBtn = $("bombBtn");
pad.hidden = bombBtn.hidden = !touchUI || ATTRACT;
/** The D-pad works like a little stick: the direction is wherever your thumb is from its middle. */
function padAt(e) {
  const b = pad.getBoundingClientRect(), dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
  padDir = Math.hypot(dx, dy) < 14 ? -1 : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : dy > 0 ? 2 : 0;
  for (const el of pad.children) el.classList.toggle("on", +el.dataset.d === padDir);
}
pad.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); try { pad.setPointerCapture(e.pointerId); } catch {} padAt(e); });
pad.addEventListener("pointermove", (e) => { if (pad.hasPointerCapture && pad.hasPointerCapture(e.pointerId)) padAt(e); });
for (const ev of ["pointerup", "pointercancel"]) pad.addEventListener(ev, () => { padDir = -1; for (const el of pad.children) el.classList.remove("on"); });
bombBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); me.wantBomb = true; bombBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) bombBtn.addEventListener(ev, () => bombBtn.classList.remove("on"));
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); });
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame); // first, so one exception can never stop the game
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; world.was = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  amHost = isHost();
  if (amHost) hostTick(dt, Date.now()); else world.was = false;
  const r = round();
  if (r) { V = view(r); clientTick(r, dt); myTick(r, dt); }
  draw(r, dt, now);
  if (now - lastHud > 200) { lastHud = now; hud(r); }
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { seats: 6, crates: 0.5, dropChance: 0.55, startBombs: 2, startFire: 3, fuseMs: 1900, countMs: 300, roundMs: 7000, sdStepMs: 110,
    endMs: 1400, winsToWin: 99, botThinkMs: [60, 160], botReactMs: [80, 200], botBombGapMs: [300, 900], botAggro: 0.6 });
  net = await connect();
  joinedAt = performance.now();
  net.onState((st) => { S = st; });
  net.on("bomb", (msg, from) => { if (isHost() && msg) applyBomb(from, msg); });
  net.on("kick", (msg, from) => { if (isHost() && msg) applyKick(from, msg); });
  net.on("pick", (msg, from) => { if (isHost() && msg) applyPick(from, msg); });
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const r0 = cached("round", S.shared.round, null);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(r0?.bots || []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
